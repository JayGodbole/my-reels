name: post-reel

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: mkdir -p data assets out
      - run: python scripts/generate_script.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: python scripts/make_audio.py
      - run: python scripts/fetch_visual.py
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      - run: python scripts/make_overlays.py
      - run: python scripts/assemble.py
      - uses: actions/upload-artifact@v4
        with:
          name: reel
          path: out/reel.mp4
      - run: python scripts/post_reel.py
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
